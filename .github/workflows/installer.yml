name: Installers

# Build the native Drama Llama installers on their own operating systems:
#   Linux   -> PyInstaller onedir wizard wrapped as an AppImage (+ tarball)
#   Windows -> PyInstaller wizard wrapped by Inno Setup
#
# PyInstaller cannot cross-compile, so each target runs on its native runner.
# Tag pushes also attach the artifacts and their SHA-256 files to the release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "installer/**"
      - "scripts/build_installer.py"
      - "scripts/build_spatial.py"
      - "src/drama_studio/spatial/**"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test:
    name: Installer core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run installer tests
        run: python -m pytest tests/test_installer.py tests/test_windows_paths.py -q
      - name: Lint the installer
        run: python -m ruff check installer scripts/build_installer.py tests/test_installer.py tests/test_windows_paths.py
      - name: Resolve-check the pinned Python stack
        # The unit tests mock uv, so unresolvable pins (wrong torch channel
        # builds, nonexistent package versions) used to reach releases.
        # This dry-run resolves the exact install_stack() arguments per
        # channel without downloading anything.
        run: |
          python -m pip install -q uv
          python scripts/check_pins.py

  linux:
    name: Linux AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-util1 libxcb-image0 libxcb-render-util0 libxcb-keysyms1 \
            libxcb-icccm4 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 \
            libxcb-sync1 libxcb-xfixes0 libxkbcommon0
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6
          # The Suno bridge imports the BetterSuno modules from this tree and
          # the payload copies its pure-JavaScript dependencies. The upstream
          # postinstall script is local-only, so skip lifecycle scripts.
          npm ci --ignore-scripts --prefix third_party/bettersuno-mcp
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install appimagetool
        # Optional: without it build_installer.py falls back to a tarball.
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            || echo "appimagetool download failed; the tarball fallback will be used"
          sudo chmod +x /usr/local/bin/appimagetool || true
      - name: Build installers
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/build_installer.py --target linux --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/build_installer.py --target linux
          fi
      - name: Check TLS on an Arch trust store
        # The AppImage bundles the Ubuntu build host's OpenSSL, whose compiled-in
        # CA paths do not exist on Arch/CachyOS. Run the artifact in an Arch
        # container once with the system store and once with no store at all, to
        # exercise both the probe and the no-verification fallback.
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(dist/*.AppImage)
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "no AppImage built; skipping the Arch trust-store check"
            exit 0
          fi
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -c '
            set -eo pipefail
            pacman -Q ca-certificates >/dev/null 2>&1 ||
              pacman -Sy --noconfirm ca-certificates >/dev/null 2>&1 || true
            cp /dist/*.AppImage /tmp/setup.AppImage
            chmod +x /tmp/setup.AppImage
            echo "--- with the system trust store ---"
            APPIMAGE_EXTRACT_AND_RUN=1 /tmp/setup.AppImage --headless --check-tls https://github.com | tee /tmp/check.txt
            grep -q "verification: enabled" /tmp/check.txt
            echo "--- without any trust store ---"
            rm -rf /etc/ssl/certs /etc/ssl/cert.pem /etc/pki/tls/certs
            APPIMAGE_EXTRACT_AND_RUN=1 /tmp/setup.AppImage --headless --check-tls https://github.com | tee /tmp/check.txt
            grep -q "verification: disabled" /tmp/check.txt
          '
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dramallama-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  spatial:
    name: Native spatial renderer (Linux)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # CBLAS backend only. ubuntu-22.04 matches the AppImage job's glibc
          # baseline so the asset also loads on older user distros.
          sudo apt-get install -y cmake libopenblas-dev liblapacke-dev
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check out the pinned Spatial_Audio_Framework
        # SAF is ISC-licensed and lives outside this repository. The commit is
        # pinned in installer/pins.json — never resolved to a moving branch.
        # Only the framework and the ambi_roomsim example are compiled; nothing
        # from SPARTA's GPLv3 plug-in tree is fetched or built.
        run: |
          set -euo pipefail
          sha="$(python -c "import json;print(json.load(open('installer/pins.json'))['spatial']['saf_commit'])")"
          git clone --filter=blob:none --no-checkout \
            https://github.com/leomccormack/Spatial_Audio_Framework third_party/Spatial_Audio_Framework
          git -C third_party/Spatial_Audio_Framework fetch --depth 1 origin "$sha"
          git -C third_party/Spatial_Audio_Framework checkout --quiet FETCH_HEAD
          test -f third_party/Spatial_Audio_Framework/framework/include/saf.h
      - name: Build the shim
        run: |
          python scripts/build_spatial.py \
            --saf third_party/Spatial_Audio_Framework \
            --output dist/spatial
      - name: Verify the asset is loadable and physically correct
        # The M0 spike asserts the direct-path arrival time, the decode pan
        # law and the listener-rotation behaviour, so a published binary that
        # merely loads but renders nonsense cannot reach a release.
        env:
          DRAMA_LLAMA_SPATIAL_LIB: ${{ github.workspace }}/build/spatial/libdrama_llama_spatial.so
        run: |
          python scripts/spike_spatial.py
          python -m pytest tests/test_spatial.py -q
      - name: Package the artifact
        run: |
          set -euo pipefail
          saf="third_party/Spatial_Audio_Framework"
          # ISC requires the licence to travel with the derived binary.
          cp "$saf/LICENSE.md" dist/spatial/SAF-LICENSE.md
          tar -C dist/spatial -czf dist/dramallama-spatial-linux-x86_64.tar.gz \
            libdrama_llama_spatial.so SAF-LICENSE.md
          sha256sum dist/dramallama-spatial-linux-x86_64.tar.gz > dist/dramallama-spatial-linux-x86_64.tar.gz.sha256
          cat dist/dramallama-spatial-linux-x86_64.tar.gz.sha256
          tar tzf dist/dramallama-spatial-linux-x86_64.tar.gz
      - name: Upload spatial artifact
        uses: actions/upload-artifact@v4
        with:
          name: dramallama-spatial-linux
          path: |
            dist/dramallama-spatial-linux-x86_64.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6
          npm ci --ignore-scripts --prefix third_party/bettersuno-mcp
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Build installers
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/build_installer.py --target windows --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/build_installer.py --target windows
          fi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dramallama-windows
          path: |
            dist/DramaLlama-Setup-*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Attach artifacts to the release
    # The spatial renderer is optional (staging falls back to a dry mix and
    # ships disabled while installer/pins.json has no asset hash), so publish
    # the installers even when its verification fails; attach its artifact when
    # it succeeded.
    if: always() && github.ref_type == 'tag' && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, windows, spatial]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(artifacts/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no artifacts to publish" >&2
            exit 1
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "Drama Llama ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
