[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drama-llama"
version = "0.3.0"
description = "Drama Llama: a local web app for turning scripts into audio dramas with Breeze, Chatterbox and Suno."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  # Imported by the API, worker handlers, mixer and engine adapters.
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
]
# Audio stack needed for rendering, alignment and stem extraction. The
# installer pins the exact torch/CUDA wheel channel via installer/pins.json;
# manual installs get the default PyPI wheel.
tts = [
  "torch>=2.9",
  "torchaudio>=2.9",
  "faster-whisper>=1.0",
  "librosa>=0.10",
  "demucs>=4.1",
  # Static ffmpeg used by the mixer when the host has no compatible build.
  # The installer exposes its binary as <prefix>/bin/ffmpeg.
  "imageio-ffmpeg==0.7.0",
]
# English Breeze checkpoint support. The Breeze repo code itself is bundled by
# the installer (see INSTALL.md); these are the extra Python imports it needs.
breeze = [
  "transformers==4.57.3",
  "qwen-tts==0.1.1",
  "huggingface-hub>=0.34",
]

[project.scripts]
drama-llama = "drama_studio.cli:main"
drama-studio = "drama_studio.cli:main"  # legacy alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Broad exception handling is deliberate around optional ffmpeg/Ollama calls;
# FastAPI's File(...) default is the documented idiom.
ignore = ["B008", "BLE001", "S110", "PLW1510"]
