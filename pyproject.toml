[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drama-studio"
version = "0.1.0"
description = "Local web app for turning scripts into audio dramas with Breeze and Qwen3 TTS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
drama-studio = "drama_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Broad exception handling is deliberate around optional ffmpeg/Ollama calls;
# FastAPI's File(...) default is the documented idiom.
ignore = ["B008", "BLE001", "S110", "PLW1510"]
